<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學生名單管理 - 智慧宿舍系統</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
  />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="min-h-screen">
    <!-- 側邊選單 -->
    <aside class="fixed inset-y-0 z-40 flex w-64 flex-col bg-slate-950 p-6 text-white shadow-xl">
      <div class="mb-8 flex items-center gap-3 border-b border-slate-800 pb-5">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-blue-500 to-cyan-400">
          <i data-lucide="shield-check" class="h-5 w-5"></i>
        </div>
        <div>
          <p class="text-[11px] uppercase tracking-[0.22em] text-slate-400">Smart Dormitory</p>
          <p class="text-lg font-bold">管理端後台</p>
        </div>
      </div>

      <nav class="flex-1 space-y-1 text-sm">
        <a
          href="./admin-dashboard.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
          <span>數據概覽</span>
        </a>

        <a
          href="./admin-students.html"
          aria-current="page"
          class="flex items-center gap-3 rounded-xl bg-slate-800 px-4 py-3 font-semibold text-white ring-1 ring-slate-700"
        >
          <i data-lucide="users" class="h-4 w-4"></i>
          <span>學生名單管理</span>
        </a>

        <a
          href="./admin-face-records.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="scan-face" class="h-4 w-4"></i>
          <span>人臉識別紀錄</span>
        </a>

        <a
          href="./admin-package.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="package" class="h-4 w-4"></i>
          <span>包裹入庫登記</span>
        </a>

        <a
          href="./admin-visitor.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="user-plus" class="h-4 w-4"></i>
          <span>訪客申請審核</span>
        </a>

        <a
          href="./admin-maintenance.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="wrench" class="h-4 w-4"></i>
          <span>設備報修處理</span>
        </a>

        <a
          href="./admin-medical.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-red-400 transition hover:bg-red-900/40"
        >
          <i data-lucide="ambulance" class="h-4 w-4"></i>
          <span>緊急醫療監控</span>
        </a>
      </nav>

      <button
        id="logoutBtn"
        type="button"
        class="mt-6 flex items-center gap-3 border-t border-slate-800 px-4 pt-4 text-xs text-slate-500 hover:text-red-400"
      >
        <i data-lucide="log-out" class="h-4 w-4"></i>
        <span>安全登出</span>
      </button>
    </aside>

    <!-- 主內容 -->
    <main class="ml-64 p-6 lg:p-10">
      <!-- 頁首 -->
      <header class="mb-8">
        <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Student Management</p>
        <h1 class="mt-1 flex items-center gap-2 text-3xl font-bold">
          <i data-lucide="users" class="h-7 w-7 text-blue-600"></i>
          <span>學生名單管理</span>
        </h1>
        <p class="mt-2 text-sm text-slate-500">管理宿舍成員資料與登入帳號</p>
      </header>

      <!-- 單筆新增 / 編輯 -->
      <section class="mb-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="flex items-center gap-2 text-lg font-bold text-slate-700">
            <i data-lucide="user-plus" class="h-5 w-5"></i>
            <span id="formTitle">輸入新學生</span>
          </h2>
          <button
            id="cancelEditBtn"
            type="button"
            class="hidden rounded-lg border border-slate-300 px-3 py-1 text-xs text-slate-500 transition-colors hover:bg-slate-50"
          >
            取消編輯
          </button>
        </div>

        <form
          id="studentForm"
          class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-6"
        >
          <div class="space-y-1">
            <label class="ml-1 text-xs font-bold text-slate-400">系級</label>
            <input
              id="sClass"
              type="text"
              required
              placeholder="例如：資管三B"
              class="w-full rounded-xl border p-3 outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="space-y-1">
            <label class="ml-1 text-xs font-bold text-slate-400">
              學號（登入帳號）
            </label>
            <input
              id="sId"
              type="text"
              required
              placeholder="學號"
              class="w-full rounded-xl border p-3 outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="space-y-1">
            <label class="ml-1 text-xs font-bold text-slate-400">姓名</label>
            <input
              id="sName"
              type="text"
              required
              placeholder="姓名"
              class="w-full rounded-xl border p-3 outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="space-y-1">
            <label class="ml-1 text-xs font-bold text-slate-400">電話</label>
            <input
              id="sPhone"
              type="tel"
              required
              placeholder="09xx-xxx-xxx"
              class="w-full rounded-xl border p-3 outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="space-y-1">
            <label class="ml-1 text-xs font-bold text-slate-400">房號 - 床號</label>
            <div class="flex gap-1">
              <input
                id="sRoom"
                type="text"
                required
                placeholder="房號"
                class="w-2/3 rounded-xl border p-3 outline-none focus:ring-2 focus:ring-blue-500"
              />
              <input
                id="sBed"
                type="text"
                required
                placeholder="床"
                class="w-1/3 rounded-xl border p-3 outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>

          <div class="flex items-end">
            <button
              id="submitBtn"
              type="submit"
              class="w-full rounded-xl bg-blue-600 p-3 font-bold text-white shadow-lg shadow-blue-100 transition-colors hover:bg-blue-700"
            >
              新增學生
            </button>
          </div>
        </form>

        <div
          id="formMsg"
          class="mt-4 hidden rounded-xl p-3 text-sm"
        ></div>
      </section>

      <!-- 批次 Excel 匯入 -->
      <section class="mb-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="mb-3 flex items-center gap-2 text-lg font-bold text-slate-700">
          <i data-lucide="file-spreadsheet" class="h-5 w-5 text-emerald-600"></i>
          <span>Excel 批次匯入學生名單</span>
        </h2>

        <p class="mb-4 text-xs text-slate-400">
          Excel 欄位順序依序為：
          <span
            class="rounded bg-slate-100 px-2 py-0.5 font-mono"
          >
            系級 / 學號 / 姓名 / 電話 / 房號 / 床號
          </span>
          ，第一列可為標題，系統會自動略過。
        </p>

        <div class="flex flex-col items-start gap-3 sm:flex-row sm:items-center">
          <label
            class="flex cursor-pointer items-center gap-2 rounded-xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-emerald-100 transition-colors hover:bg-emerald-700"
          >
            <i data-lucide="upload" class="h-4 w-4"></i>
            <span>選擇 Excel 檔案</span>
            <input
              id="excelInput"
              type="file"
              class="hidden"
              accept=".xlsx,.xls,.csv"
            />
          </label>

          <button
            id="downloadTemplate"
            type="button"
            class="flex items-center gap-2 rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50"
          >
            <i data-lucide="download" class="h-4 w-4"></i>
            <span>下載範本</span>
          </button>

          <span
            id="importFileName"
            class="text-xs italic text-slate-400"
          >
            尚未選擇檔案
          </span>
        </div>

        <div id="previewArea" class="mt-5 hidden">
          <div class="mb-3 flex items-center justify-between">
            <p
              id="previewCount"
              class="text-sm font-bold text-slate-700"
            ></p>
            <button
              id="confirmImportBtn"
              type="button"
              class="flex items-center gap-2 rounded-xl bg-blue-600 px-5 py-2 text-sm font-bold text-white shadow-lg shadow-blue-100 transition-colors hover:bg-blue-700"
            >
              <i data-lucide="check-circle" class="h-4 w-4"></i>
              <span>確認全部匯入</span>
            </button>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 text-xs uppercase text-slate-400">
                <tr>
                  <th class="p-3 text-left">系級</th>
                  <th class="p-3 text-left">學號</th>
                  <th class="p-3 text-left">姓名</th>
                  <th class="p-3 text-left">電話</th>
                  <th class="p-3 text-left">房號</th>
                  <th class="p-3 text-left">床號</th>
                  <th class="p-3 text-left">狀態</th>
                </tr>
              </thead>
              <tbody
                id="previewBody"
                class="divide-y divide-slate-100"
              ></tbody>
            </table>
          </div>
        </div>

        <div
          id="importMsg"
          class="mt-4 hidden rounded-xl p-3 text-sm"
        ></div>
      </section>

      <!-- 學生列表 -->
      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <!-- 標題 + 搜尋列 -->
        <div class="border-b bg-slate-50 p-4">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-700">全體成員列表</span>
              <span
                id="studentCount"
                class="rounded-full bg-blue-100 px-3 py-1 text-xs font-bold text-blue-700"
              >
                載入中…
              </span>
            </div>

            <!-- 搜尋輸入框 -->
            <div class="relative w-full md:w-80">
              <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                <i data-lucide="search" class="h-4 w-4"></i>
              </span>
              <input
                id="studentSearch"
                type="text"
                placeholder="搜尋姓名、學號、系級、電話或房號…"
                class="w-full rounded-xl border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm text-slate-700 outline-none ring-0 transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
              />
            </div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-left">
            <thead>
              <tr class="border-b text-xs uppercase tracking-wider text-slate-400">
                <th class="p-4 font-medium">系級</th>
                <th class="p-4 font-medium">學號</th>
                <th class="p-4 font-medium">姓名</th>
                <th class="p-4 font-medium">電話</th>
                <th class="p-4 font-medium">房號 - 床號</th>
                <th class="p-4 text-center font-medium">操作</th>
              </tr>
            </thead>
            <tbody
              id="studentList"
              class="divide-y divide-slate-100"
            ></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <audio
    id="alarmAudio"
    src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3"
    preload="auto"
  ></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      query,
      where,
      writeBatch,
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs6t5RsKjIr0mJEI6gnk579AIcG-_FJ_I",
      authDomain: "smartdorm-3ab79.firebaseapp.com",
      projectId: "smartdorm-3ab79",
      storageBucket: "smartdorm-3ab79.firebasestorage.app",
      messagingSenderId: "240227925869",
      appId: "1:240227925869:web:5a71f95a2f18bef1972464",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 管理員權限檢查
    if (localStorage.getItem("userRole") !== "admin") {
      window.location.href = "./login.html";
    }

    // 緊急醫療即時監聽
    const alarm = document.getElementById("alarmAudio");
    onSnapshot(
      query(collection(db, "medical"), where("status", "==", "processing")),
      (snap) => {
        if (snap.empty) {
          alarm.pause();
          alarm.currentTime = 0;
          return;
        }

        alarm.play().catch(() => {});
        const data = snap.docs[0].data();

        setTimeout(() => {
          const ok = confirm(
            `🚨 【緊急求助】\n\n房號：${data.room}\n學生：${data.name}\n\n是否立刻前往醫療分頁處理？`
          );
          if (ok) window.location.href = "./admin-medical.html";
        }, 500);
      }
    );

    // 表單與狀態
    let editingId = null;

    const form = document.getElementById("studentForm");
    const formMsg = document.getElementById("formMsg");
    const submitBtn = document.getElementById("submitBtn");
    const formTitle = document.getElementById("formTitle");
    const cancelEditBtn = document.getElementById("cancelEditBtn");

    const sClass = document.getElementById("sClass");
    const sId = document.getElementById("sId");
    const sName = document.getElementById("sName");
    const sPhone = document.getElementById("sPhone");
    const sRoom = document.getElementById("sRoom");
    const sBed = document.getElementById("sBed");

    function setCreateMode() {
      editingId = null;
      formTitle.textContent = "輸入新學生";
      submitBtn.textContent = "新增學生";
      submitBtn.className =
        "w-full rounded-xl bg-blue-600 p-3 font-bold text-white shadow-lg shadow-blue-100 transition-colors hover:bg-blue-700";
      sId.disabled = false;
      cancelEditBtn.classList.add("hidden");
      form.reset();
    }

    function setEditMode(student) {
      editingId = student.studentId;
      formTitle.textContent = `編輯學生：${student.studentId}`;
      submitBtn.textContent = "更新學生資料";
      submitBtn.className =
        "w-full rounded-xl bg-emerald-600 p-3 font-bold text-white shadow-lg shadow-emerald-100 transition-colors hover:bg-emerald-700";
      cancelEditBtn.classList.remove("hidden");

      sClass.value = student.class || "";
      sId.value = student.studentId || "";
      sName.value = student.name || "";
      sPhone.value = student.phone || "";
      sRoom.value = student.room || "";
      sBed.value = student.bed || "";
      sId.disabled = true;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    cancelEditBtn.addEventListener("click", setCreateMode);

    // 搜尋相關 DOM & 狀態
    const studentSearchInput = document.getElementById("studentSearch");
    let studentsCache = []; // 會在 onSnapshot 裡更新

    function renderStudentTable(list) {
      const tbody = document.getElementById("studentList");

      if (!list.length) {
        tbody.innerHTML =
          '<tr><td colspan="6" class="p-20 text-center text-slate-400">目前無學生資料</td></tr>';
        return;
      }

      tbody.innerHTML = list
        .map(
          (s) => `
        <tr class="transition-colors hover:bg-slate-50">
          <td class="p-4 text-slate-600">${s.class || "未設定"}</td>
          <td class="p-4 font-mono font-bold text-blue-600">${s.studentId}</td>
          <td class="p-4 font-semibold text-slate-800">${s.name}</td>
          <td class="p-4 text-slate-500">${s.phone || "—"}</td>
          <td class="p-4">
            <span
              class="rounded-lg bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600"
            >
              ${s.room || "—"}-${s.bed || "—"}
            </span>
          </td>
          <td class="p-4 space-x-2 text-center">
            <button
              type="button"
              class="inline-flex items-center justify-center p-2 text-slate-400 transition-colors hover:text-emerald-600"
              title="編輯"
              onclick="editStudent('${s.studentId}')"
            >
              <i data-lucide="edit-3" class="h-5 w-5"></i>
            </button>
            <button
              type="button"
              class="inline-flex items-center justify-center p-2 text-slate-300 transition-colors hover:text-red-500"
              title="刪除"
              onclick="deleteStudent('${s.studentId}')"
            >
              <i data-lucide="trash-2" class="h-5 w-5"></i>
            </button>
          </td>
        </tr>
      `
        )
        .join("");

      lucide.createIcons();
    }

    function applyStudentFilter() {
      const keyword = studentSearchInput.value.trim().toLowerCase();
      if (!keyword) {
        renderStudentTable(studentsCache);
        return;
      }

      const filtered = studentsCache.filter((s) => {
        const classStr = (s.class || "").toLowerCase();
        const idStr = (s.studentId || "").toLowerCase();
        const nameStr = (s.name || "").toLowerCase();
        const phoneStr = (s.phone || "").toLowerCase();
        const roomStr = (s.room || "").toLowerCase();
        const roomBedStr = `${s.room || ""}-${s.bed || ""}`.toLowerCase();

        return (
          classStr.includes(keyword) ||
          idStr.includes(keyword) ||
          nameStr.includes(keyword) ||
          phoneStr.includes(keyword) ||
          roomStr.includes(keyword) ||
          roomBedStr.includes(keyword)
        );
      });

      renderStudentTable(filtered);
    }

    studentSearchInput.addEventListener("input", applyStudentFilter);

    // 學生列表即時更新
    onSnapshot(collection(db, "users"), (snap) => {
      const countEl = document.getElementById("studentCount");

      const students = snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .filter((s) => s.role === "student")
        .sort(
          (a, b) =>
            (a.room || "").localeCompare(b.room || "") ||
            (a.bed || "").localeCompare(b.bed || "")
        );

      studentsCache = students;
      window.__studentsCache = students;

      countEl.textContent = `目前共計 ${students.length} 位學生`;

      // 根據目前搜尋關鍵字決定顯示哪一批
      applyStudentFilter();
    });

    // 新增 / 更新單筆
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const sid = sId.value.trim();
      const payload = {
        class: sClass.value.trim(),
        studentId: sid,
        name: sName.value.trim(),
        phone: sPhone.value.trim(),
        room: sRoom.value.trim(),
        bed: sBed.value.trim(),
        role: "student",
      };

      if (!editingId) {
        payload.password = sid; // 預設密碼 = 學號
      }

      try {
        await setDoc(doc(db, "users", sid), payload, { merge: true });

        formMsg.textContent = editingId
          ? "✅ 學生資料已更新"
          : "✅ 學生帳號已建立（預設密碼同學號）";
        formMsg.className =
          "mt-4 block rounded-xl bg-green-50 p-3 text-sm font-bold text-green-700";

        if (editingId) {
          setCreateMode();
        } else {
          form.reset();
        }
      } catch (err) {
        formMsg.textContent = "❌ 錯誤：" + err.message;
        formMsg.className =
          "mt-4 block rounded-xl bg-red-50 p-3 text-sm text-red-700";
      }

      setTimeout(() => formMsg.classList.add("hidden"), 5000);
    });

    // 刪除學生
    window.deleteStudent = async (studentId) => {
      const ok = confirm(
        `確定要將學號 ${studentId} 從系統中移除嗎？\n此動作將使其無法登入。`
      );
      if (!ok) return;

      await deleteDoc(doc(db, "users", studentId));
      if (editingId === studentId) setCreateMode();
    };

    // 啟用編輯模式
    window.editStudent = (studentId) => {
      const students = window.__studentsCache || [];
      const target = students.find((s) => s.studentId === studentId);
      if (target) setEditMode(target);
    };

    // Excel 批次匯入
    let parsedRows = [];

    const excelInput = document.getElementById("excelInput");
    const previewArea = document.getElementById("previewArea");
    const previewBody = document.getElementById("previewBody");
    const previewCount = document.getElementById("previewCount");
    const confirmImportBtn = document.getElementById("confirmImportBtn");
    const importMsg = document.getElementById("importMsg");
    const importFileName = document.getElementById("importFileName");

    excelInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      importFileName.textContent = file.name;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const workbook = XLSX.read(evt.target.result, { type: "binary" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const allRows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: "",
        });

        const firstRow = allRows[0] || [];
        const isHeader = firstRow.some((cell) =>
          /[A-Za-z\u4e00-\u9fa5]/.test(String(cell))
        );
        const dataRows = isHeader ? allRows.slice(1) : allRows;

        parsedRows = dataRows
          .filter((row) => row[1])
          .map((row) => ({
            class: String(row[0] || "").trim(),
            studentId: String(row[1] || "").trim(),
            name: String(row[2] || "").trim(),
            phone: String(row[3] || "").trim(),
            room: String(row[4] || "").trim(),
            bed: String(row[5] || "").trim(),
          }));

        previewCount.textContent = `共解析到 ${parsedRows.length} 筆資料，確認後將批次寫入 Firestore`;
        previewBody.innerHTML = parsedRows
          .map(
            (r) => `
          <tr class="hover:bg-slate-50">
            <td class="p-3 text-slate-600">${r.class || "—"}</td>
            <td class="p-3 font-mono font-bold text-blue-600">${r.studentId}</td>
            <td class="p-3">${r.name}</td>
            <td class="p-3 text-slate-500">${r.phone || "—"}</td>
            <td class="p-3">${r.room || "—"}</td>
            <td class="p-3">${r.bed || "—"}</td>
            <td class="p-3">
              <span class="rounded-full bg-yellow-100 px-2 py-0.5 text-xs font-medium text-yellow-700">
                待匯入
              </span>
            </td>
          </tr>
        `
          )
          .join("");

        previewArea.classList.remove("hidden");
        lucide.createIcons();
      };

      reader.readAsBinaryString(file);
    });

    confirmImportBtn.addEventListener("click", async () => {
      if (!parsedRows.length) return;

      confirmImportBtn.disabled = true;
      confirmImportBtn.textContent = "匯入中…";

      try {
        const chunkSize = 400;

        for (let i = 0; i < parsedRows.length; i += chunkSize) {
          const chunk = parsedRows.slice(i, i + chunkSize);
          const batch = writeBatch(db);

          chunk.forEach((row) => {
            batch.set(
              doc(db, "users", row.studentId),
              {
                ...row,
                role: "student",
                password: row.studentId,
              },
              { merge: true }
            );
          });

          await batch.commit();
        }

        importMsg.textContent = `✅ 成功匯入 ${parsedRows.length} 位學生（預設密碼皆為學號）`;
        importMsg.className =
          "mt-4 block rounded-xl bg-green-50 p-3 text-sm font-bold text-green-700";

        previewArea.classList.add("hidden");
        parsedRows = [];
        excelInput.value = "";
        importFileName.textContent = "尚未選擇檔案";
      } catch (err) {
        importMsg.textContent = "❌ 匯入失敗：" + err.message;
        importMsg.className =
          "mt-4 block rounded-xl bg-red-50 p-3 text-sm text-red-700";
      }

      confirmImportBtn.disabled = false;
      confirmImportBtn.textContent = "確認全部匯入";
      setTimeout(() => importMsg.classList.add("hidden"), 6000);
    });

    document
      .getElementById("downloadTemplate")
      .addEventListener("click", () => {
        const ws = XLSX.utils.aoa_to_sheet([
          ["系級", "學號", "姓名", "電話", "房號", "床號"],
          ["資管三B", "411220413", "王小明", "0912345678", "A201", "A"],
          ["資管三B", "411220414", "李小華", "0987654321", "A201", "B"],
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "學生名單");
        XLSX.writeFile(wb, "學生名單範本.xlsx");
      });

    // 登出（同時登出 Firebase 管理員驗證）
    document.getElementById("logoutBtn").onclick = async () => {
      try {
        await signOut(auth);
      } finally {
        localStorage.clear();
        window.location.href = "./login.html";
      }
    };

    setCreateMode();
    lucide.createIcons();
  </script>
</body>
</html>
