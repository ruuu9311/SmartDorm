<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人臉識別紀錄 - 智慧宿舍</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
  />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: "Noto Sans TC", system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-900">
  <div class="min-h-screen">
    <aside
      class="fixed inset-y-0 z-50 flex w-64 flex-col bg-slate-950 p-6 text-white shadow-xl"
    >
      <div class="mb-8 flex items-center gap-3 border-b border-slate-800 pb-5">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-blue-500 to-cyan-400"
        >
          <i data-lucide="shield-check" class="h-5 w-5"></i>
        </div>
        <div>
          <p class="text-[11px] uppercase tracking-[0.22em] text-slate-400">
            Smart Dormitory
          </p>
          <p class="text-lg font-bold">管理端後台</p>
        </div>
      </div>

      <nav class="flex-1 space-y-1 text-sm">
        <button
          id="backBtn"
          type="button"
          class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          <span>返回上一頁</span>
        </button>

        <a
          href="./admin-students.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="users" class="h-4 w-4"></i>
          <span>學生名單管理</span>
        </a>

        <a
          href="./admin-face-records.html"
          aria-current="page"
          class="flex items-center gap-3 rounded-xl bg-slate-800 px-4 py-3 font-semibold text-white ring-1 ring-slate-700"
        >
          <i data-lucide="scan-face" class="h-4 w-4"></i>
          <span>人臉識別紀錄</span>
        </a>

        <a
          href="./admin-package.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="package" class="h-4 w-4"></i>
          <span>包裹入庫登記</span>
        </a>

        <a
          href="./admin-visitor.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="user-plus" class="h-4 w-4"></i>
          <span>訪客申請審核</span>
        </a>

        <a
          href="./admin-maintenance.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition hover:bg-slate-800 hover:text-white"
        >
          <i data-lucide="wrench" class="h-4 w-4"></i>
          <span>設備報修處理</span>
        </a>

        <a
          href="./admin-medical.html"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-red-400 transition hover:bg-red-900/40"
        >
          <i data-lucide="ambulance" class="h-4 w-4"></i>
          <span>緊急醫療監控</span>
        </a>
      </nav>

      <button
        id="logoutBtn"
        type="button"
        class="mt-6 flex items-center gap-3 border-t border-slate-800 px-4 pt-4 text-xs text-slate-500 hover:text-red-400"
      >
        <i data-lucide="log-out" class="h-4 w-4"></i>
        <span>安全登出</span>
      </button>
    </aside>

    <main class="ml-64 p-6 lg:p-10">
      <header class="mb-8">
        <p class="text-xs uppercase tracking-[0.2em] text-slate-400">
          Face Recognition Records
        </p>
        <h1 class="mt-1 text-3xl font-bold">人臉識別紀錄</h1>
        <p id="dateDisplay" class="mt-2 text-sm text-slate-500"></p>

        <div class="mt-3 flex items-center gap-2 text-sm">
          <span
            id="connectionDot"
            class="h-2 w-2 rounded-full bg-amber-400"
          ></span>
          <span id="connectionText" role="status" class="text-slate-500">
            正在確認登入狀態…
          </span>
        </div>
      </header>

      <!-- Firebase 管理員驗證 -->
      <section
        id="authPanel"
        class="hidden max-w-lg rounded-3xl border border-slate-200 bg-white p-8 shadow-sm"
      >
        <div class="mb-6 flex items-center gap-3">
          <div
            class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-50 text-blue-600"
          >
            <i data-lucide="lock-keyhole" class="h-5 w-5"></i>
          </div>
          <div>
            <h2 class="text-lg font-bold">管理員安全驗證</h2>
            <p class="text-sm text-slate-500">
              查看人臉識別紀錄需要 Firebase 管理員身分
            </p>
          </div>
        </div>

        <form id="adminLoginForm" class="space-y-5">
          <div>
            <label for="adminEmail" class="mb-2 block text-sm text-slate-600">
              管理員 Email
            </label>
            <input
              id="adminEmail"
              type="email"
              autocomplete="username"
              required
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500"
            />
          </div>

          <div>
            <label
              for="adminPassword"
              class="mb-2 block text-sm text-slate-600"
            >
              密碼
            </label>
            <input
              id="adminPassword"
              type="password"
              autocomplete="current-password"
              required
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500"
            />
          </div>

          <div
            id="authError"
            role="alert"
            class="hidden rounded-xl border border-red-100 bg-red-50 p-3 text-sm font-medium text-red-600"
          ></div>

          <button
            id="adminLoginBtn"
            type="submit"
            class="w-full rounded-xl bg-blue-600 px-4 py-3 font-bold text-white transition hover:bg-blue-700 disabled:opacity-60"
          >
            驗證並查看紀錄
          </button>
        </form>
      </section>

      <!-- 紀錄內容 -->
      <div id="recordsArea" class="hidden">
        <section class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <div class="rounded-2xl border border-slate-200 bg-white p-6">
            <p class="text-sm text-slate-500">已載入紀錄</p>
            <p id="totalCount" class="mt-2 text-3xl font-bold">—</p>
          </div>

          <div class="rounded-2xl border border-emerald-100 bg-white p-6">
            <p class="text-sm text-slate-500">辨識通過</p>
            <p
              id="grantedCount"
              class="mt-2 text-3xl font-bold text-emerald-600"
            >
              —
            </p>
          </div>

          <div class="rounded-2xl border border-red-100 bg-white p-6">
            <p class="text-sm text-slate-500">未通過／處理異常</p>
            <p id="otherCount" class="mt-2 text-3xl font-bold text-red-500">
              —
            </p>
          </div>
        </section>

        <section
          class="mt-6 flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-5 lg:flex-row lg:items-end"
        >
          <div class="flex-1">
            <label for="searchInput" class="mb-2 block text-sm text-slate-600">
              搜尋識別身分或裝置
            </label>
            <input
              id="searchInput"
              type="search"
              placeholder="例如：411302825 或 dorm-entrance-01"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500"
            />
          </div>

          <div>
            <label for="statusFilter" class="mb-2 block text-sm text-slate-600">
              辨識結果
            </label>
            <select
              id="statusFilter"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 lg:w-44"
            >
              <option value="all">全部結果</option>
              <option value="granted">辨識通過</option>
              <option value="denied">辨識未通過</option>
              <option value="error">處理異常</option>
            </select>
          </div>
        </section>

        <p class="mt-3 text-xs leading-relaxed text-slate-500">
          僅顯示最新 100 筆，統計與搜尋也只涵蓋這些紀錄。
          「辨識通過」不代表門鎖已實際開啟。
        </p>

        <section
          class="mt-5 overflow-hidden rounded-2xl border border-slate-200 bg-white"
        >
          <div
            class="flex items-center justify-between border-b border-slate-100 p-5"
          >
            <h2 class="font-semibold">最新識別紀錄</h2>
            <span id="visibleCount" class="text-xs text-slate-500">0 筆</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full whitespace-nowrap text-left text-sm">
              <thead class="bg-slate-50 text-slate-500">
                <tr>
                  <th class="px-5 py-4 font-medium">辨識時間</th>
                  <th class="px-5 py-4 font-medium">識別身分</th>
                  <th class="px-5 py-4 font-medium">辨識結果</th>
                  <th class="px-5 py-4 font-medium">比對分數</th>
                  <th class="px-5 py-4 font-medium">人臉數</th>
                  <th class="px-5 py-4 font-medium">耗時</th>
                  <th class="px-5 py-4 font-medium">裝置</th>
                </tr>
              </thead>
              <tbody id="recordsBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      orderBy,
      limit,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs6t5RsKjIr0mJEI6gnk579AIcG-_FJ_I",
      authDomain: "smartdorm-3ab79.firebaseapp.com",
      projectId: "smartdorm-3ab79",
      storageBucket: "smartdorm-3ab79.firebasestorage.app",
      messagingSenderId: "240227925869",
      appId: "1:240227925869:web:5a71f95a2f18bef1972464"
    };

    const $ = (id) => document.getElementById(id);

    const el = {
      authPanel: $("authPanel"),
      recordsArea: $("recordsArea"),
      loginForm: $("adminLoginForm"),
      email: $("adminEmail"),
      password: $("adminPassword"),
      loginBtn: $("adminLoginBtn"),
      authError: $("authError"),
      body: $("recordsBody"),
      search: $("searchInput"),
      filter: $("statusFilter"),
      total: $("totalCount"),
      granted: $("grantedCount"),
      other: $("otherCount"),
      visible: $("visibleCount"),
      connectionText: $("connectionText"),
      connectionDot: $("connectionDot")
    };

    let records = [];
    let unsubscribeRecords = null;

    $("dateDisplay").textContent = new Date().toLocaleDateString("zh-TW", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    });

    // 舊後台登入狀態只負責畫面導向，不是資料庫授權
    if (localStorage.getItem("userRole") !== "admin") {
      window.location.replace("./login.html");
      throw new Error("Not logged in to the admin dashboard");
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function setConnection(text, color) {
      el.connectionText.textContent = text;
      el.connectionDot.className = `h-2 w-2 rounded-full ${color}`;
    }

    function stopRecordsListener() {
      if (unsubscribeRecords) {
        unsubscribeRecords();
        unsubscribeRecords = null;
      }
    }

    function showAuthPanel(message = "") {
      stopRecordsListener();
      records = [];
      el.recordsArea.classList.add("hidden");
      el.authPanel.classList.remove("hidden");

      if (message) {
        el.authError.textContent = message;
        el.authError.classList.remove("hidden");
      } else {
        el.authError.classList.add("hidden");
      }

      setConnection("需要管理員 Email 驗證", "bg-amber-400");
    }

    function showRecordsArea() {
      el.authPanel.classList.add("hidden");
      el.recordsArea.classList.remove("hidden");
    }

    function authErrorMessage(error) {
      switch (error.code) {
        case "auth/invalid-email":
          return "Email 格式不正確";
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Email 或密碼錯誤";
        case "auth/too-many-requests":
          return "嘗試次數過多，請稍後再試";
        case "auth/network-request-failed":
          return "網路連線失敗，請稍後再試";
        default:
          return error.message || "驗證失敗，請稍後再試";
      }
    }

    function showMessage(message) {
      el.body.replaceChildren();

      const row = document.createElement("tr");
      const cell = document.createElement("td");

      cell.colSpan = 7;
      cell.className = "px-5 py-12 text-center text-slate-500";
      cell.textContent = message;

      row.appendChild(cell);
      el.body.appendChild(row);
    }

    function resultType(record) {
      if (record.ok !== true) return "error";
      if (record.granted === true) return "granted";
      if (record.granted === false) return "denied";
      return "error";
    }

    function formatTime(value) {
      if (!value || typeof value.toDate !== "function") return "—";

      const date = value.toDate();
      if (Number.isNaN(date.getTime())) return "—";

      return date.toLocaleString("zh-TW", {
        timeZone: "Asia/Taipei",
        hour12: false
      });
    }

    function formatNumber(value, digits = null) {
      if (typeof value !== "number" || !Number.isFinite(value)) return "—";
      return digits === null ? String(value) : value.toFixed(digits);
    }

    function addCell(row, text) {
      const cell = document.createElement("td");
      cell.className = "px-5 py-4 text-slate-600";
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }

    function renderRecords() {
      const keyword = el.search.value.trim().toLowerCase();
      const selectedStatus = el.filter.value;

      const filtered = records.filter((record) => {
        const searchable = [record.match ?? "", record.deviceId ?? ""]
          .join(" ")
          .toLowerCase();

        return (
          searchable.includes(keyword) &&
          (selectedStatus === "all" || resultType(record) === selectedStatus)
        );
      });

      el.visible.textContent = `${filtered.length} 筆`;

      if (filtered.length === 0) {
        showMessage(
          records.length === 0
            ? "目前沒有識別紀錄；需由辨識後端寫入資料後才會顯示。"
            : "沒有符合篩選條件的紀錄。"
        );
        return;
      }

      const statusMap = {
        granted: {
          text: "辨識通過",
          classes: "bg-emerald-100 text-emerald-700"
        },
        denied: {
          text: "辨識未通過",
          classes: "bg-red-100 text-red-700"
        },
        error: {
          text: "處理異常",
          classes: "bg-amber-100 text-amber-700"
        }
      };

      const fragment = document.createDocumentFragment();

      for (const record of filtered) {
        const row = document.createElement("tr");
        row.className = "hover:bg-slate-50";

        addCell(row, formatTime(record.createdAt));

        const identity =
          record.match === null ||
          record.match === undefined ||
          record.match === ""
            ? "未識別"
            : String(record.match);
        addCell(row, identity);

        const type = resultType(record);
        const statusCell = addCell(row, "");
        const badge = document.createElement("span");
        badge.className =
          `rounded-full px-3 py-1 text-xs font-medium ${statusMap[type].classes}`;
        badge.textContent = statusMap[type].text;
        statusCell.appendChild(badge);

        addCell(row, formatNumber(record.score, 3));
        addCell(row, formatNumber(record.faces));

        const duration = formatNumber(record.ms);
        addCell(row, duration === "—" ? duration : `${duration} ms`);

        addCell(row, String(record.deviceId ?? "未指定"));

        fragment.appendChild(row);
      }

      el.body.replaceChildren(fragment);
    }

    function startRecordsListener() {
      stopRecordsListener();
      showRecordsArea();
      showMessage("正在載入…");

      const recordsQuery = query(
        collection(db, "face_records"),
        orderBy("createdAt", "desc"),
        limit(100)
      );

      unsubscribeRecords = onSnapshot(
        recordsQuery,
        (snapshot) => {
          records = snapshot.docs.map((docSnap) => ({
            ...docSnap.data(),
            id: docSnap.id
          }));

          const grantedCount = records.filter(
            (record) => resultType(record) === "granted"
          ).length;

          el.total.textContent = String(records.length);
          el.granted.textContent = String(grantedCount);
          el.other.textContent = String(records.length - grantedCount);

          setConnection(
            snapshot.metadata.fromCache
              ? "目前顯示本機快取，等待伺服器同步"
              : "識別紀錄已同步",
            snapshot.metadata.fromCache ? "bg-amber-400" : "bg-emerald-400"
          );

          renderRecords();
        },
        (error) => {
          console.error("讀取識別紀錄失敗：", error);

          records = [];
          el.total.textContent = "—";
          el.granted.textContent = "—";
          el.other.textContent = "—";
          el.visible.textContent = "—";

          setConnection("紀錄讀取失敗", "bg-red-500");
          showMessage(
            `無法讀取紀錄（${error.code ?? "unknown"}），請確認管理員權限與 Firestore 規則。`
          );
        }
      );
    }

    async function verifyAdminAndLoad(user) {
      try {
        // true = 強制取得最新 token，才能讀到剛設定的 admin claim
        const tokenResult = await user.getIdTokenResult(true);

        if (tokenResult.claims.admin !== true) {
          await signOut(auth);
          showAuthPanel("此帳號沒有管理員權限，請改用有 admin 權限的帳號。");
          return;
        }

        startRecordsListener();
      } catch (error) {
        console.error("管理員驗證失敗：", error);
        showAuthPanel(authErrorMessage(error));
      }
    }

    el.loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      el.authError.classList.add("hidden");
      el.loginBtn.disabled = true;
      el.loginBtn.textContent = "驗證中…";

      try {
        await signInWithEmailAndPassword(
          auth,
          el.email.value.trim(),
          el.password.value
        );
        el.password.value = "";
        // 後續由 onAuthStateChanged 處理
      } catch (error) {
        el.authError.textContent = authErrorMessage(error);
        el.authError.classList.remove("hidden");
      } finally {
        el.loginBtn.disabled = false;
        el.loginBtn.textContent = "驗證並查看紀錄";
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        showAuthPanel();
        return;
      }

      setConnection("正在確認管理員權限…", "bg-amber-400");
      verifyAdminAndLoad(user);
    });

    el.search.addEventListener("input", renderRecords);
    el.filter.addEventListener("change", renderRecords);

    $("backBtn").onclick = () => window.history.back();

    $("logoutBtn").onclick = async () => {
      stopRecordsListener();

      try {
        await signOut(auth);
      } finally {
        localStorage.clear();
        window.location.href = "./login.html";
      }
    };

    window.addEventListener("pagehide", stopRecordsListener, { once: true });

    lucide.createIcons();
  </script>
</body>
</html>
