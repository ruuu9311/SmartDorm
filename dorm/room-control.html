<body class="bg-gray-50 text-gray-900">
  <div id="page">

  <script type="module">
    import {

    import {
      getFirestore,
      doc,

    // =========================================================
    // Firebase 設定
    // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAs6t5RsKjIr0mJEI6gnk579AIcG-_FJ_I",
      authDomain: "smartdorm-3ab79.firebaseapp.com",
      projectId: "smartdorm-3ab79",
      storageBucket: "smartdorm-3ab79.firebasestorage.app",
      messagingSenderId: "240227925869",
      appId: "1:240227925869:web:5a71f95a2f18bef1972464"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // =========================================================
    // 登入資料
    // =========================================================
    const studentId = localStorage.getItem("studentId");

    if (!studentId) {
      window.location.href = "./login.html";
      throw new Error("未登入");
    }

    let cachedUser = null;

    try {
      cachedUser = JSON.parse(
        localStorage.getItem("currentUser") || "null"
      );
    } catch (error) {
      console.warn("登入快取格式錯誤：", error);
    }

    let userData = {
      name: cachedUser?.name || "使用者",
      room: cachedUser?.room || "—",
      sid: cachedUser?.studentId || studentId
    };

    // =========================================================
    // MQTT 設定
    // =========================================================
    const MQTT_URL = "wss://broker.emqx.io:8084/mqtt";
    const LIGHT_TOPIC = "smartdorm/411220413/relay3";
    const FAN_TOPIC = "smartdorm/411220413/fan";

    // true：網頁開燈發 OFF；網頁關燈發 ON。
    const LIGHT_COMMAND_INVERTED = true;

    const MQTT_CLIENT_ID =
      "web-411220413-" +
      Date.now() +
      "-" +
      Math.random().toString(16).slice(2);

    let mqttClient = null;
    let mqttConnected = false;
    let mqttStatusMessage = "MQTT 連線中...";
    let firebaseStatusMessage = "Firebase 資料讀取中...";

    // =========================================================
    // 設備狀態
    // light / fan：true / false
    // ac："off" 關 / "auto" 自動 / "on" 開
    // =========================================================
    const defaultControl = {
      light: false,
      ac: "off",
      fan: false
    };

    function normalizeAc(value) {
      if (value === "on" || value === "auto" || value === "off") return value;
      if (value === true) return "on";
      return "off";
    }

    let controlState = { ...defaultControl };
    let shellBuilt = false;
    let controlsBusy = false;
    let controlsReady = false;

    // =========================================================
    // 冷氣模式外觀
    // =========================================================

      {
        value: "off",
        label: "關",
        icon: "power",
        activeBtn: "bg-gray-500 text-white shadow-md",
        badge: "bg-gray-100 text-gray-600 border-gray-200",
        card: "border-gray-200 bg-white",
        iconWrap: "bg-gray-100 text-gray-400",
        title: "冷氣已關閉",
        desc: "目前不會運轉，節省用電。"
      },
      {
        value: "auto",
        label: "自動",
        icon: "sparkles",
        activeBtn: "bg-emerald-500 text-white shadow-md",
        badge: "bg-emerald-50 text-emerald-700 border-emerald-200",
        card: "border-emerald-300 bg-emerald-50/50",
        iconWrap: "bg-emerald-100 text-emerald-600",
        title: "自動模式",
        desc: "依室內溫度自動調整，兼顧舒適與節能。"
      },
      {
        value: "on",
        label: "開",
        icon: "snowflake",
        activeBtn: "bg-sky-500 text-white shadow-md",
        badge: "bg-sky-50 text-sky-700 border-sky-200",
        card: "border-sky-300 bg-sky-50/50",
        iconWrap: "bg-sky-100 text-sky-600",

    function getAcMode(value) {
      return acModes.find((m) => m.value === value) || acModes[0];
    }

    // =========================================================
    // 情境模式
    // =========================================================
    const scenes = {
      home: {
        name: "在家模式",
        desc: "開燈、開風扇、冷氣開",
        icon: "house",
        btnClass:
          "border-amber-200 hover:border-amber-400 hover:bg-amber-50/40",
        iconWrap: "bg-amber-50 text-amber-600",
        state: { light: true, ac: "on", fan: true }
      },
      away: {
        name: "外出模式",
        desc: "關燈、關風扇、冷氣關",
        icon: "door-open",
        btnClass:
          "border-rose-200 hover:border-rose-400 hover:bg-rose-50/40",
        iconWrap: "bg-rose-50 text-rose-600",
        state: { light: false, ac: "off", fan: false }
      },
      sleep: {
        name: "睡眠模式",
        desc: "關燈、開風扇、冷氣自動",
        icon: "moon",
        btnClass:
          "border-indigo-200 hover:border-indigo-400 hover:bg-indigo-50/40",
        iconWrap: "bg-indigo-50 text-indigo-600",
        state: { light: false, ac: "auto", fan: true }
      },
      eco: {
        name: "節能模式",
        desc: "開燈、開風扇、冷氣自動",
        icon: "leaf",
        btnClass:
          "border-emerald-200 hover:border-emerald-400 hover:bg-emerald-50/40",
        iconWrap: "bg-emerald-50 text-emerald-600",
        state: { light: true, ac: "auto", fan: true }
      }
    };

    const navItems = [
      { href: "./dashboard.html", icon: "layout-dashboard", label: "首頁 Dashboard" },
      { href: "./room-control.html", icon: "home", label: "房間控制", active: true },
      { href: "./energy.html", icon: "zap", label: "能源監控" },
      { href: "./package.html", icon: "package", label: "包裹管理" },
      { href: "./maintenance.html", icon: "wrench", label: "維修報修" },
      { href: "./visitor.html", icon: "users", label: "訪客管理" },
      { href: "./medical.html", icon: "heart-pulse", label: "緊急通知" }
    ];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => {
        const replacements = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return replacements[character];
      });
    }

    function initIcons() {
      window.lucide?.createIcons();
    }

    function getRoomKey() {
      return userData.room && userData.room !== "—"
        ? userData.room
        : studentId;
    }

    function switchClass(isOn, activeColor) {
      return `
        relative inline-flex h-8 w-14 items-center rounded-full transition-colors
        ${isOn ? activeColor : "bg-gray-300"}
      `;
    }

    function knobClass(isOn) {
      return `
        inline-block h-6 w-6 transform rounded-full bg-white shadow transition
        ${isOn ? "translate-x-7" : "translate-x-1"}
      `;
    }

    function mqttStatusClass() {
      return mqttConnected
        ? "border-green-100 bg-green-50 text-green-700"
        : "border-yellow-100 bg-yellow-50 text-yellow-700";
    }

    function mqttStatusIcon() {
      return mqttConnected ? "circle-check-big" : "wifi-off";
    }

    // =========================================================
    // MQTT 發送
    // =========================================================
    function publishMqttCommand(topic, payload, deviceName) {
      return new Promise((resolve, reject) => {
        if (!mqttClient || !mqttConnected || !mqttClient.connected) {
          reject(new Error("MQTT 尚未連線，請等待連線完成"));
          return;
        }

        const timer = setTimeout(() => {
          reject(new Error(`${deviceName}命令發送逾時`));
        }, 10000);

        try {
          mqttClient.publish(
            topic,
            payload,
            { qos: 0, retain: false },
            (error) => {
              clearTimeout(timer);

              if (error) {
                reject(error);
                return;
              }

              console.log(
                `[MQTT] ${deviceName}：Topic=${topic}，Payload=${payload}`
              );

              resolve();
            }
          );
        } catch (error) {
          clearTimeout(timer);
          reject(error);
        }
      });
    }

    function publishLightState(isOn) {
      const commandOn = LIGHT_COMMAND_INVERTED ? !isOn : isOn;
      const payload = commandOn ? "ON" : "OFF";

      console.log(
        `[燈光] 網頁設定=${isOn ? "開燈" : "關燈"}，發送=${payload}`
      );

      return publishMqttCommand(LIGHT_TOPIC, payload, "模型燈");
    }

    function publishFanState(isOn) {
      return publishMqttCommand(
        FAN_TOPIC,
        isOn ? "ON" : "OFF",
        "風扇"
      );
    }

    function startMqtt() {
      if (!window.mqtt) {
        mqttStatusMessage = "MQTT.js 載入失敗，請重新整理頁面。";
        updateMqttStatusOnly();
        return;
      }

      mqttClient = window.mqtt.connect(MQTT_URL, {
        clientId: MQTT_CLIENT_ID,
        username: "emqx",
        password: "public",
        clean: true,
        reconnectPeriod: 2000,
        connectTimeout: 10000,
        keepalive: 60
      });

      mqttClient.on("connect", () => {
        mqttConnected = true;
        mqttStatusMessage =
          "MQTT Broker 已連接，可發送燈光與風扇命令。";
        updateMqttStatusOnly();
      });

      mqttClient.on("reconnect", () => {
        mqttConnected = false;
        mqttStatusMessage = "MQTT 重新連線中...";
        updateMqttStatusOnly();
      });

      mqttClient.on("close", () => {
        mqttConnected = false;
        mqttStatusMessage = "MQTT 已中斷，正在嘗試重新連線。";
        updateMqttStatusOnly();
      });

      mqttClient.on("offline", () => {
        mqttConnected = false;
        mqttStatusMessage = "MQTT 目前離線。";
        updateMqttStatusOnly();
      });

      mqttClient.on("error", (error) => {
        mqttConnected = false;
        mqttStatusMessage = "MQTT 連線錯誤，請確認網路。";
        console.error("MQTT 錯誤：", error);
        updateMqttStatusOnly();
      });
    }

    // =========================================================
    // 設備卡片
    // =========================================================
        function renderLightCard(disabled) {
        const on = controlState.light;

        return `
          <div
            data-device="light"
            role="switch"
            tabindex="${disabled ? "-1" : "0"}"
            aria-checked="${on}"
            aria-label="切換電燈"
            aria-disabled="${disabled}"
            class="select-none rounded-2xl border-2 shadow-sm px-6 py-6 transition-all duration-300 ${
              disabled
                ? "opacity-60 cursor-not-allowed"
                : "cursor-pointer hover:shadow-md active:scale-[0.99]"
            } ${
              on
                ? "border-amber-300 bg-gradient-to-br from-amber-50 to-yellow-50"
                : "border-gray-200 bg-white hover:border-amber-200"
            }"
          >
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 ${

                }">

                </div>

                <div>
                  <h4 class="text-lg font-semibold text-gray-900">電燈</h4>
                  <span class="inline-flex items-center gap-1.5 mt-1 px-2.5 py-0.5 rounded-full border text-xs font-bold ${
                    on
                      ? "bg-amber-100 text-amber-700 border-amber-200"
                      : "bg-gray-100 text-gray-500 border-gray-200"
                  }">
                    <span class="w-1.5 h-1.5 rounded-full ${
                      on ? "bg-amber-500 animate-pulse" : "bg-gray-400"
                    }"></span>
                    ${on ? "亮燈中" : "已關閉"}
                  </span>
                  <p class="mt-1 text-xs text-gray-400">點擊方塊即可切換</p>
                </div>
              </div>

              <span class="${switchClass(on, "bg-amber-400")}">
                <span class="${knobClass(on)}"></span>
              </span>
            </div>
          </div>
        `;
      }

    function renderAcCard(disabled) {
      const current = getAcMode(controlState.ac);

      return `
        <div class="rounded-2xl border-2 shadow-sm px-6 py-6 transition-all duration-300 ${current.card}">
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-4">
              <div class="w-16 h-16 rounded-2xl flex items-center justify-center transition-all duration-300 ${current.iconWrap}">
                <i data-lucide="${current.icon}" class="w-8 h-8 ${
                  current.value === "on" ? "animate-pulse" : ""
                }"></i>
              </div>

              <div>
                <h4 class="text-lg font-semibold text-gray-900">冷氣</h4>
                <span class="inline-flex items-center gap-1.5 mt-1 px-2.5 py-0.5 rounded-full border text-xs font-bold ${current.badge}">
                  ${current.title}
                </span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 p-1.5 rounded-xl bg-gray-100">
            ${acModes.map((mode) => {
              const active = controlState.ac === mode.value;

              return `
                <button
                  type="button"
                  data-ac="${mode.value}"
                  aria-pressed="${active}"

                  class="flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-sm font-bold transition-all ${

            }).join("")}

          <p class="mt-3 text-sm text-gray-500">${current.desc}</p>

      `;
    }

        function renderFanCard(disabled) {
        const on = controlState.fan;

        return `
          <div
            data-device="fan"
            role="switch"
            tabindex="${disabled ? "-1" : "0"}"

              <span class="${switchClass(on, "bg-teal-500")}">
                <span class="${knobClass(on)}"></span>
              </span>
            </div>
          </div>
        `;
      }
    // =========================================================
    // 介面
    // =========================================================

          <div class="flex-1 flex flex-col ml-64 min-h-screen">
            <header class="bg-gray-50 border-b border-gray-200 px-6 py-5 sticky top-0 z-10">
              <h1 class="text-xl font-bold text-gray-900">房間控制</h1>
              <p id="header-room" class="text-lg text-gray-500 mt-1">
                ${escapeHtml(userData.room)}｜${escapeHtml(userData.sid)}
              </p>
            </header>

            <main id="main-content" class="p-8 max-w-[1500px] mx-auto w-full">
              ${renderMainContent()}
            </main>
          </div>
        </div>
      `;

      document.getElementById("logoutBtn").addEventListener("click", () => {
        mqttClient?.end(true);
        localStorage.removeItem("studentId");
        localStorage.removeItem("currentUser");
        window.location.href = "./login.html";
      });

      initIcons();
      bindControls();
    }

    function updateMqttStatusOnly() {
      const box = document.getElementById("mqtt-status-box");

      if (!box) return;

      box.className = `
        rounded-2xl border px-5 py-4 text-sm ${mqttStatusClass()}
      `;

      box.innerHTML = `
        <div class="flex items-center gap-2">
          <i data-lucide="${mqttStatusIcon()}" class="w-4 h-4"></i>
          <span>${escapeHtml(mqttStatusMessage)}</span>
        </div>
      `;

      initIcons();
    }

    function updateContent() {
      if (!shellBuilt) {
        renderShell();
        return;
      }

      const mainEl = document.getElementById("main-content");
      if (mainEl) mainEl.innerHTML = renderMainContent();

      const nameEl = document.getElementById("sidebar-name");
      const roomEl = document.getElementById("sidebar-room");
      const headerRoomEl = document.getElementById("header-room");

      if (nameEl) nameEl.textContent = userData.name;
      if (roomEl) roomEl.textContent = userData.room;

      if (headerRoomEl) {
        headerRoomEl.textContent = `${userData.room}｜${userData.sid}`;
      }

      initIcons();
      bindControls();
    }

    // =========================================================
    // Firebase 儲存
    // =========================================================
    async function saveControlState(roomKey, state) {
      await setDoc(
        doc(db, "roomControl", roomKey),
        {
          room: userData.room || "",
          studentId,
          light: Boolean(state.light),
          ac: normalizeAc(state.ac),
          fan: Boolean(state.fan),
          updatedAt: new Date().toISOString()
        },
        { merge: true }
      );
    }

    async function persistCurrentState(roomKey) {
      try {
        await saveControlState(roomKey, { ...controlState });
        firebaseStatusMessage = "Firebase 設備設定已儲存。";
      } catch (error) {
        console.error("Firebase 儲存失敗：", error);
        firebaseStatusMessage = "Firebase 儲存失敗，設定尚未同步。";

        alert(
          "操作設定已更新；若有實體命令，已嘗試發送。" +
          "但 Firebase 儲存失敗，請檢查網路或資料庫權限。" +
          "網頁不會自動送出相反命令。"
        );
      }
    }

    // =========================================================
    // 設備控制
    // =========================================================
    async function toggleDevice(key) {
      if (controlsBusy || !controlsReady) return;

      const newValue = !controlState[key];
      const roomKey = getRoomKey();

      controlsBusy = true;
      updateContent();

      try {
        if (key === "light") {
          await publishLightState(newValue);
        } else if (key === "fan") {
          await publishFanState(newValue);
        }

        controlState[key] = newValue;
        await persistCurrentState(roomKey);
      } catch (error) {
        console.error("設備命令發送失敗：", error);

        alert(
          `設備命令發送失敗：${error.message}。` +
          "若發送逾時，實體狀態可能不確定，請目視確認。"
        );
      } finally {
        controlsBusy = false;
        updateContent();
      }
    }

    async function setAcMode(mode) {
      if (controlsBusy || !controlsReady) return;
      if (controlState.ac === mode) return;

      const roomKey = getRoomKey();

      controlsBusy = true;
      updateContent();

      try {
        // 冷氣目前僅更新網頁設定，不發送 MQTT
        controlState.ac = normalizeAc(mode);
        await persistCurrentState(roomKey);
      } finally {
        controlsBusy = false;
        updateContent();
      }
    }

    async function applyScene(sceneKey) {
      if (controlsBusy || !controlsReady) return;

      const scene = scenes[sceneKey];
      if (!scene) return;

      const targetState = { ...scene.state };
      const roomKey = getRoomKey();

      controlsBusy = true;
      updateContent();

      try {
        await publishLightState(targetState.light);
        controlState.light = targetState.light;

        await publishFanState(targetState.fan);
        controlState.fan = targetState.fan;

        controlState.ac = normalizeAc(targetState.ac);

        await persistCurrentState(roomKey);
      } catch (error) {
        console.error("情境模式命令發送失敗：", error);

        alert(
          `情境模式未完整套用：${error.message}。` +
          "已送出的命令不會自動撤回，請確認燈光與風扇狀態。"
        );
      } finally {
        controlsBusy = false;
        updateContent();
      }
    }

        function bindControls() {
        document.querySelectorAll("[data-device]").forEach((el) => {
          el.addEventListener("click", () => {
            toggleDevice(el.dataset.device);
          });

          el.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleDevice(el.dataset.device);
            }
          });
        });

        document.querySelectorAll("[data-ac]").forEach((btn) => {
          btn.addEventListener("click", () => {
            setAcMode(btn.dataset.ac);
          });
        });

        document.querySelectorAll("[data-scene]").forEach((btn) => {
          btn.addEventListener("click", () => {
            applyScene(btn.dataset.scene);
          });
        });
      }

    // =========================================================
    // 啟動
    // =========================================================
    renderShell();
    startMqtt();

    let loadedRoomKey = null;
    let userLoadVersion = 0;

    onSnapshot(
      doc(db, "users", studentId),
      async (snap) => {
        const version = ++userLoadVersion;

        if (snap.exists()) {
          const d = snap.data();

          userData = {
            name: d.name || cachedUser?.name || "使用者",
            room: d.room || cachedUser?.room || "—",
            sid: d.studentId || studentId
          };

          localStorage.setItem(
            "currentUser",
            JSON.stringify({
              id: studentId,
              studentId: d.studentId || studentId,
              name: d.name || "",
              room: d.room || "",
              bed: d.bed || "",
              class: d.class || ""
            })
          );
        }

        const roomKey = getRoomKey();

        if (loadedRoomKey === roomKey) {
          updateContent();
          return;
        }

        controlsReady = false;
        updateContent();

        try {
          const roomSnap = await getDoc(
            doc(db, "roomControl", roomKey)
          );

          if (version !== userLoadVersion) return;

          const saved = roomSnap.exists() ? roomSnap.data() : {};

          controlState = {
            light: typeof saved.light === "boolean"
              ? saved.light : defaultControl.light,
            ac: normalizeAc(saved.ac),
            fan: typeof saved.fan === "boolean"
              ? saved.fan : defaultControl.fan
          };

          loadedRoomKey = roomKey;
          firebaseStatusMessage = "Firebase 已讀取最後儲存的設備設定。";
        } catch (error) {
          if (version !== userLoadVersion) return;

          console.error("讀取房間控制資料失敗：", error);
          firebaseStatusMessage =
            "Firebase 設定讀取失敗，目前使用預設設定。";
        } finally {
          if (version === userLoadVersion) {
            controlsReady = true;
            updateContent();
          }
        }
      },
      (error) => {
        console.error("讀取使用者資料失敗：", error);
        firebaseStatusMessage =
          "使用者資料讀取失敗，目前使用登入快取資料。";
        controlsReady = true;
        updateContent();
      }
    );
  </script>
</body>
</html>
